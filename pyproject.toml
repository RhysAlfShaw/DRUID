[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DRUID"
version = "1.0"
description = "Astronomical Source finder build with Persistent Homology."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Rhys Shaw", email = "rhys.shaw@bristol.ac.uk" }
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy",
    "polars",
    "scipy",
    "astropy",
    "scikit-image",
    "photutils",
    "cripser",
    "bottleneck",
    "matplotlib",
    "tqdm",
    "setproctitle",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/RhysAlfShaw/DRUID"
Repository = "https://github.com/RhysAlfShaw/DRUID.git"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov"
]

[tool.setuptools.packages.find]
include = ["DRUID*"]
